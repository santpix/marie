name: Wire Marie Assets

on:
  push:
    paths:
      - '.github/workflows/import-marie-assets.yml'
      - 'assets/00_logo.jpg'
      - 'assets/01_hero_slide_*.jpg'
      - 'assets/02_new_styles_*.jpg'
      - 'assets/03_lounging_model_green_sofa.jpg'
      - 'assets/05_blog_*.jpg'
      - 'assets/06_footer_black_white.jpg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Map uploaded photography to Vogue theme asset names
        run: |
          set -e
          cp assets/00_logo.jpg assets/marie-logo.jpg
          cp assets/01_hero_slide_01.jpg assets/marie-hero-01.jpg
          cp assets/01_hero_slide_02.jpg assets/marie-hero-02.jpg
          cp assets/01_hero_slide_03.jpg assets/marie-hero-03.jpg
          cp assets/02_new_styles_lilac_halo.jpg assets/marie-new-style-lilac.jpg
          cp assets/02_new_styles_pink_ivory_flower.jpg assets/marie-new-style-pink-ivory.jpg
          cp assets/02_new_styles_blue_percher.jpg assets/marie-new-style-blue.jpg
          cp assets/03_lounging_model_green_sofa.jpg assets/marie-lounging.jpg
          cp assets/05_blog_black_white_hat.jpg assets/marie-blog-black-white.jpg
          cp assets/05_blog_autumn_fun.jpg assets/marie-blog-autumn.jpg
          cp assets/05_blog_yellow_paris.jpg assets/marie-blog-yellow-paris.jpg
          cp assets/06_footer_black_white.jpg assets/marie-footer.jpg

      - name: Verify mapped images
        run: |
          file assets/marie-*.jpg
          for f in assets/marie-logo.jpg assets/marie-hero-01.jpg assets/marie-hero-02.jpg assets/marie-hero-03.jpg assets/marie-new-style-lilac.jpg assets/marie-new-style-pink-ivory.jpg assets/marie-new-style-blue.jpg assets/marie-lounging.jpg assets/marie-blog-black-white.jpg assets/marie-blog-autumn.jpg assets/marie-blog-yellow-paris.jpg assets/marie-footer.jpg; do test -s "$f"; done

      - name: Commit mapped theme assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/marie-*.jpg
          if git diff --cached --quiet; then
            echo "Theme assets already current"
          else
            git commit -m "Map Marie photography into Vogue experience"
            git push origin HEAD:main
          fi
