name: Import Marie Assets

on:
  push:
    paths:
      - '.github/workflows/import-marie-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gdown
        run: pip install --quiet gdown

      - name: Download Marie supplied assets from Google Drive
        run: |
          mkdir -p assets
          gdown --id 1XdcUsNIXJFZmQiWLBfv86nKZ8a8pIXyV -O assets/marie-hero-01.jpg
          gdown --id 1NFpyqI4ZlKsz7M76sCZlDGPMopvr03vE -O assets/marie-hero-02.jpg
          gdown --id 14G-6kb6ur6zTGC9krOVANQO5HqqciKa- -O assets/marie-hero-03.jpg
          gdown --id 1WoR40io5XhC52TLMzGILnFb5a5bk0qTW -O assets/marie-lounging.jpg
          gdown --id 14IBWcELyyPRBFIv-uSHSn6nybIOEX7vi -O assets/marie-blog-black-white.jpg
          gdown --id 1-JHjIkTifft8U8JcyrsMTAee-H5Iifey -O assets/marie-blog-autumn.jpg
          gdown --id 1pWBdP2omgFWaFVZ6kuWUN4NhCPFnClmY -O assets/marie-blog-yellow-paris.jpg
          gdown --id 1R8HbZOjqB5RepwGizlxNuDOVRkG4fp8Q -O assets/marie-logo.jpg

      - name: Verify image files
        run: |
          file assets/marie-*.jpg
          test -s assets/marie-hero-01.jpg
          test -s assets/marie-lounging.jpg
          test -s assets/marie-logo.jpg

      - name: Commit Marie assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/marie-*.jpg
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "Add Marie supplied photography"
            git push origin HEAD:main
          fi
